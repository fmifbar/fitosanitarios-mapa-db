name: Fichas PDF del MAPA (semanal, completo)

# POR QUÉ ESTE WORKFLOW EXISTE
# ----------------------------
# El paso de PDF estaba escrito en el repositorio pero no corría nunca: el
# workflow diario solo llama a `sincronizar_servidor.py`, y `cache_pdfs/` está
# en el .gitignore, así que en un runner limpio no hay ni un PDF que procesar.
# Con lo cual `mapa_seguridad` (EPIs, reentrada, SPe3, SPe8),
# `mapa_toxicologia` (pictogramas, frases H y P) y `mapa_mitigaciones` llevaban
# congeladas desde siempre. Una tabla congelada es peor que una vacía: se
# consulta igual y responde igual.
#
# POR QUÉ SEMANAL, Y POR QUÉ COMPLETO
# ------------------------------------
# Semanal porque **el Ministerio publica una vez por semana**. Lo dice su
# propia web: «esta base de datos se actualizará semanalmente». Pedir las
# fichas más a menudo que eso es bajarse lo mismo varias veces.
#
# Completo, y no 300 por pasada, porque **una ficha puede cambiar sin cambiar
# de estado**. En la comparación del 02/10/2026 sobre 50 fichas, la única que
# había cambiado en dos semanas (ES-01265) lo hizo en la fecha de caducidad,
# con el estado intacto. Un criterio incremental la habría dejado esperando
# turno. Un barrido completo no deja ese hueco.
#
# Lo que cuesta, medido contra el servidor del Ministerio: 0,1-0,2 s y 70-335 KB
# por ficha; las 2.081 en unos 25-30 minutos y ~480 MB, una vez por semana.
# El PDF hay que bajarlo siempre porque el MAPA no admite peticiones
# condicionales (sin ETag ni Last-Modified), pero si el SHA-256 coincide con el
# guardado no se extrae ni se escribe: la base apenas se mueve.
#
# HORARIO: EL MINISTERIO PUBLICA EL VIERNES, NOSOTROS RECOGEMOS EL DOMINGO
# -------------------------------------------------------------------------
# La web del Registro lo dice así: «Esta base de datos se actualiza
# semanalmente, los viernes a partir de las 14 horas».
#
# MATIZ MEDIDO EL 02/10/2026: eso vale para las **fichas**, que cambian muy
# despacio (de 50 comparadas entre el 18/09 y el 02/10, solo una, y solo la
# fecha de caducidad). Pero el JSON del catalogo **no** cambia solo los
# viernes: comparando las fotos diarias, el cambio aparecio el martes 29/09,
# o sea que el Ministerio toco los datos el lunes 28. Por eso el flujo del
# catalogo sigue siendo diario y solo este es semanal.
# Se puede volver a medir con `comparar_dias_del_catalogo.py`.
#
#     viernes 14:00  ->  el MAPA publica
#     sábado             (dos días para que terminen de volcar)
#     domingo 05:00  ->  se recoge entero
#     lunes          ->  el técnico tiene la ficha de cada producto
#
# El domingo y no el viernes por la tarde, y el motivo está en «**a partir
# de** las 14 horas»: no es «a las 14:00». La publicación puede alargarse, y
# entrar el mismo viernes arriesga pillarles a medio volcar y guardarse un
# catálogo incompleto. El domingo llevan dos días terminados.
#
# El retraso que eso introduce es de dos días sobre la publicación, no de una
# semana: el domingo es posterior al viernes de la misma semana. Y el estado
# de un producto —si lo han cancelado— no espera a esto: de eso se encarga el
# flujo diario, que lo recoge en menos de 24 h.
#
# Además el domingo no trabaja nadie, ni aquí ni tirando del servidor del
# Ministerio, que es público.

on:
  schedule:
    # Domingos a las 05:00 UTC (07:00 aquí). El lunes el técnico tiene la
    # ficha de cada producto con la publicación del viernes anterior.
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      tope:
        description: 'Máximo de fichas en esta pasada (0 = todas)'
        required: false
        default: '0'
      forzar:
        description: 'Rehacer aunque no hayan cambiado (sí / no)'
        required: false
        default: 'no'

permissions:
  contents: write

# Dos pasadas a la vez se pisarían al escribir la base y al hacer push.
concurrency:
  group: fichas-pdf-mapa
  cancel-in-progress: false

jobs:
  fichas:
    runs-on: ubuntu-latest
    # Las 2.081 tardan unos 25-30 min. Se deja holgura por si el Ministerio va
    # lento un domingo, pero con tope para que una pasada atascada no se quede
    # colgada seis horas.
    timeout-minutes: 120

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⬇️ Traerse el catálogo de la Release
        # El `.db` ya no va en el repositorio, y el runner arranca limpio. Sin
        # esto se empezaría con una base vacía: el barrido no sabría qué
        # fichas ya tiene y el SHA-256 no podría ahorrar nada.
        run: |
          python descargar_catalogo.py --solo fitosanitarios_mapa.db

      - name: 📄 Extraer las fichas (barrido completo)
        env:
          # Sin esto, Python no escribe a una terminal y se guarda toda la
          # salida en el buffer hasta el final. En una tarea de 25 minutos eso
          # deja la pantalla en blanco todo el rato y no hay forma de
          # distinguir una que va bien de una colgada, que es justo cuando
          # hace falta saberlo. Pasó en la primera ejecución, el 02/10/2026.
          PYTHONUNBUFFERED: "1"
        run: |
          # --minutos 90 hace que la pasada pare por las buenas antes de que
          # el timeout del job (120) la mate. Si la mata GitHub, los pasos
          # siguientes NO corren y se pierde todo lo procesado.
          python enriquecer_fichas.py \
            --tope "${{ github.event.inputs.tope || '0' }}" \
            --espera 0.3 \
            --minutos 90 \
            ${{ github.event.inputs.forzar == 'sí' && '--forzar' || '' }} \
            | tee salida_fichas.log

      - name: 🔎 Comprobar antes de publicar
        # El mismo script que el flujo diario, en vez de una comprobación
        # suelta aquí. Comparaba el **tamaño del archivo**, que es un indicio
        # malo: SQLite reaprovecha páginas, así que una base puede perder la
        # mitad de las filas sin encoger un byte. Lo que cuenta son las filas.
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python comprobar_antes_de_publicar.py

      - name: 🔁 Rehacer el JSON con las fichas dentro
        # El barrido escribe en la base, no en el JSON. Sin esto, el JSON de
        # la Release se quedaría sin las fichas del domingo hasta la
        # sincronización del lunes.
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "from pathlib import Path; from exportar_a_json import exportar_base_de_datos_a_json; exportar_base_de_datos_a_json(db_path=Path('fitosanitarios_mapa.db'), json_salida=Path('fitosanitarios_mapa_completo.json'))"

      - name: 📦 Actualizar la Release «ultimo»
        # IMPRESCINDIBLE. La sincronización diaria se baja el catálogo de
        # «ultimo» para seguir trabajando sobre él. Si el barrido del domingo
        # no actualizara esa Release, el lunes se descargaría la versión del
        # sábado y **las 36 minutos de extracción de fichas se perderían**,
        # cada semana, sin que nadie lo notara.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ultimo --yes --cleanup-tag 2>/dev/null || true
          gh release create ultimo \
            fitosanitarios_mapa.db fitosanitarios_mapa_completo.json estado.json \
            --title "Catálogo al día" \
            --notes "Catálogo con las fichas PDF al día: $(date -u +'%Y-%m-%d %H:%M UTC').

          El Ministerio publica semanalmente, los viernes a partir de las 14:00.
          Los recuentos están en \`estado.json\`."

      - name: 🗄️ Guardar la foto fechada de la semana
        # EL ARCHIVO FECHADO, A PROPÓSITO Y NO POR ACCIDENTE
        # ---------------------------------------------------
        # Hasta ahora cada commit diario era, sin querer, una foto del
        # catálogo oficial de ese día. Eso vale para algo serio: **justificar
        # qué decía el Ministerio el día que se firmó un recetario**, que es
        # la clase de pregunta que llega en una inspección meses después.
        #
        # Pero estaba ahí por accidente, y el día que haya que podar el
        # historial por tamaño se perdería sin que nadie lo decidiera.
        #
        # Aquí se hace a propósito, y **semanal y no diario**, porque el
        # Ministerio publica una vez por semana: una foto diaria serían siete
        # copias idénticas de lo mismo.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FECHA=$(date -u +'%Y-%m-%d')
          gh release create "catalogo-${FECHA}" \
            fitosanitarios_mapa.db fitosanitarios_mapa_completo.json estado.json \
            --title "Catálogo del MAPA · ${FECHA}" \
            --notes "Foto del Registro Oficial de Productos Fitosanitarios tal y como estaba el ${FECHA}.

          Se guarda para poder responder, meses después, qué decía el Ministerio
          el día en que se firmó un recetario. El MAPA publica los viernes a
          partir de las 14:00 y esta foto se toma el domingo siguiente.

          Los recuentos están en \`estado.json\`." \
            2>/dev/null || echo "Ya existía la foto de ${FECHA}; no se duplica."

      - name: 💾 Guardar los cambios
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # Los PDF no se suben: `enriquecer_fichas.py` los borra según los
          # procesa y `cache_pdfs/` está en el .gitignore.
          # Solo estado.json: el catalogo va en la Release.
          git add estado.json
          # El mensaje dice si la pasada quedó a medias. Un commit que parece
          # completo y no lo es hace creer que el catálogo está al día.
          if grep -q "Agotado el margen" salida_fichas.log; then
            AVISO=" (PASADA INCOMPLETA: se agotó el margen de tiempo)"
          else
            AVISO=""
          fi
          git commit -m "📄 Fichas PDF del MAPA: $(date -u +'%Y-%m-%d %H:%M UTC')${AVISO}" \
            || echo "No hubo fichas nuevas ni cambiadas."
          git pull --rebase --autostash
          git push
