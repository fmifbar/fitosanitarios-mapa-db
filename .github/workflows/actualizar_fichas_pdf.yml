name: Fichas PDF del MAPA (semanal, completo)

# POR QUÉ ESTE WORKFLOW EXISTE
# ----------------------------
# El paso de PDF estaba escrito en el repositorio pero no corría nunca: el
# workflow diario solo llama a `sincronizar_servidor.py`, y `cache_pdfs/` está
# en el .gitignore, así que en un runner limpio no hay ni un PDF que procesar.
# Con lo cual `mapa_seguridad` (EPIs, reentrada, SPe3, SPe8),
# `mapa_toxicologia` (pictogramas, frases H y P) y `mapa_mitigaciones` llevaban
# congeladas desde siempre. Una tabla congelada es peor que una vacía: se
# consulta igual y responde igual.
#
# POR QUÉ SEMANAL, Y POR QUÉ COMPLETO
# ------------------------------------
# Semanal porque **el Ministerio publica una vez por semana**. Lo dice su
# propia web: «esta base de datos se actualizará semanalmente». Pedir las
# fichas más a menudo que eso es bajarse lo mismo varias veces.
#
# Completo, y no 300 por pasada, porque **una ficha puede cambiar sin cambiar
# de estado**. En la comparación del 02/10/2026 sobre 50 fichas, la única que
# había cambiado en dos semanas (ES-01265) lo hizo en la fecha de caducidad,
# con el estado intacto. Un criterio incremental la habría dejado esperando
# turno. Un barrido completo no deja ese hueco.
#
# Lo que cuesta, medido contra el servidor del Ministerio: 0,1-0,2 s y 70-335 KB
# por ficha; las 2.081 en unos 25-30 minutos y ~480 MB, una vez por semana.
# El PDF hay que bajarlo siempre porque el MAPA no admite peticiones
# condicionales (sin ETag ni Last-Modified), pero si el SHA-256 coincide con el
# guardado no se extrae ni se escribe: la base apenas se mueve.
#
# HORARIO: EL MINISTERIO PUBLICA LOS VIERNES A PARTIR DE LAS 14:00
# -----------------------------------------------------------------
# Lo dice su web, literal: «Esta base de datos se actualiza semanalmente, los
# viernes a partir de las 14 horas».
#
# Por eso esto corre el **viernes a las 17:00 hora de aquí** (15:00 UTC), tres
# horas después de la publicación: margen de sobra para que hayan terminado de
# volcar, y el lunes el técnico tiene la ficha de cada producto con la versión
# de esa misma semana.
#
# Se intentó primero el domingo, pensando en que el lunes estuviera listo. Pero
# el domingo recoge la publicación del viernes **anterior**: se iría siempre una
# semana por detrás sin ninguna ganancia.

on:
  schedule:
    # Viernes a las 15:00 UTC (17:00 aquí), tres horas después de que el
    # Ministerio publique. El lunes el técnico tiene la ficha de esa semana.
    - cron: '0 15 * * 5'
  workflow_dispatch:
    inputs:
      tope:
        description: 'Máximo de fichas en esta pasada (0 = todas)'
        required: false
        default: '0'
      forzar:
        description: 'Rehacer aunque no hayan cambiado (sí / no)'
        required: false
        default: 'no'

permissions:
  contents: write

# Dos pasadas a la vez se pisarían al escribir la base y al hacer push.
concurrency:
  group: fichas-pdf-mapa
  cancel-in-progress: false

jobs:
  fichas:
    runs-on: ubuntu-latest
    # Las 2.081 tardan unos 25-30 min. Se deja holgura por si el Ministerio va
    # lento un domingo, pero con tope para que una pasada atascada no se quede
    # colgada seis horas.
    timeout-minutes: 120

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📄 Extraer las fichas (barrido completo)
        run: |
          python enriquecer_fichas.py \
            --tope "${{ github.event.inputs.tope || '0' }}" \
            --espera 0.3 \
            ${{ github.event.inputs.forzar == 'sí' && '--forzar' || '' }}

      - name: 🔎 Comprobar que la base no ha menguado
        # La misma idea que la regla del 90 % para el catálogo: si una pasada
        # deja la base más pequeña que antes, algo ha ido mal y no se publica.
        # Perder datos en silencio es peor que no actualizarlos.
        run: |
          python - <<'PY'
          import subprocess, sys, os
          anterior = subprocess.run(
              ["git", "cat-file", "-s", "HEAD:fitosanitarios_mapa.db"],
              capture_output=True, text=True)
          if anterior.returncode != 0:
              print("No hay versión anterior con la que comparar; se continúa.")
              sys.exit(0)
          antes = int(anterior.stdout.strip())
          ahora = os.path.getsize("fitosanitarios_mapa.db")
          print(f"antes {antes} bytes, ahora {ahora} bytes")
          if ahora < antes * 0.9:
              sys.exit(f"La base ha perdido más del 10 %. No se publica.")
          PY

      - name: 💾 Guardar los cambios
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # Solo la base. Los PDF no se suben: `enriquecer_fichas.py` los borra
          # según los procesa y `cache_pdfs/` está en el .gitignore.
          git add fitosanitarios_mapa.db
          git commit -m "📄 Fichas PDF del MAPA: $(date -u +'%Y-%m-%d %H:%M UTC')" \
            || echo "No hubo fichas nuevas ni cambiadas."
          git pull --rebase --autostash
          git push
