name: Sincronizar Fitosanitarios MAPA

on:
  schedule:
    # Todos los días a las 04:00 UTC.
    # (Decía «todos los lunes» y el cron era diario. Lo que manda es el cron,
    #  así que lo que estaba mal era el comentario.)
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Permite ejecutarlo manualmente con un solo clic desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⬇️ Traerse el catálogo de la Release
        # IMPRESCINDIBLE desde que el `.db` no va en el repositorio.
        # El runner arranca con un clon limpio, así que sin esto empezaría con
        # una base vacía y la reconstruiría desde cero cada noche: se perderían
        # las fichas PDF (EPIs, reentrada, abejas, pictogramas), que solo se
        # rellenan los domingos y tardan 36 minutos en extraerse.
        run: |
          python descargar_catalogo.py --solo fitosanitarios_mapa.db

      - name: 🌾 Ejecutar sincronización con el Ministerio (MAPA)
        env:
          # Sin esto Python se guarda la salida en el buffer y la pantalla
          # queda en blanco mientras corre.
          PYTHONUNBUFFERED: "1"
        run: |
          python sincronizar_servidor.py

      - name: 🔎 Comprobar antes de publicar
        # Hasta el 02/10/2026 este flujo hacía commit **pase lo que pase**. Si
        # el Ministerio respondía a medias, se publicaba un catálogo con la
        # mitad de los productos y TT EDITOR se lo tragaba a la mañana
        # siguiente.
        #
        # Y un catálogo recortado no es uno viejo: uno viejo dice cosas de la
        # semana pasada, uno recortado **dice que no existe lo que sí existe**.
        #
        # Si no cuadra, este paso falla y el commit no llega a ejecutarse: se
        # queda la versión anterior, que es correcta aunque sea de ayer.
        # Escribe también `estado.json` con la fecha y los recuentos.
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python comprobar_antes_de_publicar.py

      - name: 📦 Publicar el catálogo en la Release «ultimo»
        # POR QUÉ UNA RELEASE Y NO SOLO UN COMMIT
        # ---------------------------------------
        # La base y el JSON suman 118 MB y se reescriben **enteros** cada vez
        # que cambia algo: son binarios, git no puede guardar solo la
        # diferencia. Medido: ~6,6 MB al día de crecimiento del repositorio,
        # unos 2,4 GB al año, para publicar los mismos datos.
        #
        # Las Releases guardan los archivos **fuera del historial**, así que
        # no engordan el repositorio, y dan una dirección estable:
        #
        #   .../releases/latest/download/fitosanitarios_mapa.db
        #
        # Comprobado el 02/10/2026 contra el repositorio real: la Release se
        # crea con los tres archivos, la dirección estable responde, y
        # TT EDITOR se baja los 42 MB en 2,4 s **tirando de la Release y sin
        # usar el respaldo**. Por eso los archivos grandes ya no se suben al
        # repositorio; solo `estado.json`, que pesa nada.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ultimo --yes --cleanup-tag 2>/dev/null || true
          gh release create ultimo \
            fitosanitarios_mapa.db fitosanitarios_mapa_completo.json estado.json \
            --title "Catálogo al día" \
            --notes "Última sincronización con el Registro del MAPA: $(date -u +'%Y-%m-%d %H:%M UTC').

          El Ministerio publica semanalmente, los viernes a partir de las 14:00.
          Los recuentos están en \`estado.json\`.

          Direcciones estables:
          - \`.../releases/latest/download/fitosanitarios_mapa.db\`
          - \`.../releases/latest/download/fitosanitarios_mapa_completo.json\`
          - \`.../releases/latest/download/estado.json\`"

      - name: 💾 Guardar cambios en el repositorio (Commit & Push)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # Solo estado.json: el catalogo va en la Release, que vive fuera
          # del historial. Subirlo tambien aqui era lo que engordaba el
          # repositorio 6,6 MB al dia.
          git add estado.json
          git commit -m "🤖 Actualización automática MAPA: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No hubo cambios en el registro oficial."
          git pull --rebase --autostash
          git push
