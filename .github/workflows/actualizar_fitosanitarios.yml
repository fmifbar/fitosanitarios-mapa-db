name: Sincronizar Fitosanitarios MAPA

on:
  schedule:
    # Se ejecuta automáticamente todos los lunes a las 04:00 AM UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    # Permite ejecutarlo manualmente con un solo clic desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌾 Ejecutar sincronización con el Ministerio (MAPA)
        run: |
          python sincronizar_servidor.py

      - name: 💾 Guardar cambios en el repositorio (Commit & Push)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add fitosanitarios_mapa.db fitosanitarios_mapa_completo.json
          git commit -m "🤖 Actualización automática MAPA: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No hubo cambios en el registro oficial."
          git push
